:root{--blue:#014976;--deep:#002640;--org:#FBAE42;--white:#fff;--panel:#01406a;--bad:#ffb4a2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{font-family:rpt,Tahoma,sans-serif;color:var(--white);background:radial-gradient(circle at 50% 30%,var(--blue),var(--deep) 75%) fixed var(--deep);line-height:1.7}
main{max-width:560px;margin:0 auto;padding:20px 20px 32px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:flex-start;direction:ltr}
.top img{height:64px;width:auto}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:clamp(40px,12vw,64px);line-height:1.15;margin:0;font-weight:700}
h2{font-size:24px;margin:0;font-weight:700;line-height:1.5}
p{margin:0}
.sub{font-size:19px;opacity:.9}
.rule{width:64px;height:4px;background:var(--org);border-radius:2px}
.btn{font:inherit;font-weight:700;font-size:20px;background:var(--org);color:var(--deep);border:0;border-radius:14px;padding:14px 22px;cursor:pointer;align-self:stretch}
.btn:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.path{display:flex;align-items:center;gap:0;margin-bottom:6px}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.7);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;background:var(--panel)}
.dot.done{background:var(--org);border-color:var(--org);color:var(--deep)}
.dot.now{border-color:var(--org);box-shadow:0 0 0 5px rgba(251,174,66,.28)}
.line{flex:1;height:0;border-top:3px dashed rgba(255,255,255,.35)}
.card{background:var(--panel);border-radius:18px;padding:20px;border:1px solid rgba(255,255,255,.14)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{font:inherit;font-size:18px;text-align:right;color:var(--white);background:transparent;border:2px solid rgba(255,255,255,.4);border-radius:14px;padding:14px 16px;cursor:pointer;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--org)}
.opt.ok{background:var(--org);color:var(--deep);border-color:var(--org)}
.opt.no{border-color:var(--bad);color:var(--bad);opacity:.85}
.opt:disabled{cursor:default}
.fb{border-right:5px solid var(--org);padding:6px 14px;font-size:18px;background:rgba(255,255,255,.07);border-radius:10px}
.fb.no{border-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.big{font-size:56px;font-weight:700;color:var(--org);line-height:1}
.foot{display:flex;justify-content:center;padding-top:22px}
.foot img{height:92px;width:auto}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
const Q=[
{s:"أول يوم لك في الفريق، ومش فاهم دورك بالظبط. تعمل إيه؟",o:[
["تستنى لحد ما حد يكلمك ويقولك تعمل إيه",0,"الانتظار بيضيّع وقتك ووقت الفريق، والمتطوع الواعي بيبادر بالسؤال."],
["تسأل قائد الفريق عن دورك وإيه المتوقع منك",1,"سؤال واضح من أول يوم بيوضح دورك ويبني الثقة مع الفريق."],
["تبدأ تعمل أي مهمة تشوفها قدامك",0,"الحماس حلو، لكن من غير ما تعرف دورك ممكن تكرر شغل حد تاني أو تعطّل الفريق."]]},
{s:"زميلين اختلفوا على طريقة تنظيم المبادرة، والوقت بيعدّي. تتصرف إزاي؟",o:[
["تسمع للاتنين وتقترحوا حل يجمع أفكارهم",1,"الاستماع للطرفين بيخلّي كل واحد يحس إنه مسموع، وغالبًا بيطلع حل أقوى."],
["تاخد صف اللي رأيه أقرب ليك",0,"الانحياز بيزوّد الخلاف وبيخسّرك ثقة الطرف التاني."],
["تسيبهم يحلّوها لوحدهم",0,"الخلاف لو اتساب ممكن يأثّر على تجهيز النشاط كله."]]},
{s:"هتعملوا مبادرة لأهالي منطقة، وانت متخيل إنهم محتاجين حاجة معينة. الخطوة الأولى؟",o:[
["تنفّذ اللي اتخيلته من غير تأخير",0,"الافتراض ممكن يطلع غلط، والمبادرة وقتها مش هتلمس احتياج حقيقي."],
["تسمع للأهالي وتعرف احتياجهم الفعلي الأول",1,"السماع من المجتمع هو أساس أي مبادرة بتحدث أثر حقيقي."],
["تعمل زي مبادرة قديمة نجحت في مكان تاني",0,"كل مجتمع له ظروفه، اللي نجح هناك مش شرط ينجح هنا."]]},
{s:"زميل نشر صور مستفيد من المبادرة على فيسبوك من غير إذنه، عشان يشجّع الناس تشارك. تعمل إيه؟",o:[
["تعلّق قدام الكل إن ده غلط",0,"الإحراج قدام الناس بيوتّر العلاقة، وبيفوّت فرصة التعلّم."],
["تتجاهل، فالنية كانت كويسة",0,"النية الطيبة مش بتحمي خصوصية المستفيد، وغياب الموافقة بيهزّ ثقته في المؤسسة."],
["تكلّمه بهدوء، وتطلبوا حذف الصور وتاخدوا موافقة المستفيد",1,"حماية الخصوصية مع احترام الزميل: تصحّحوا الغلط وتتعلّموا منه."]]},
{s:"قبل الفعالية بساعة: عضو في الفريق اعتذر، وبعض الأدوات ناقصة. تعمل إيه؟",o:[
["تلغي الفعالية فورًا",0,"الإلغاء آخر حل، وفيه حلول أخرى ممكنة في ساعة."],
["تقعد مع الفريق، ترتّبوا الأولويات وتوزّعوا الأدوار وتعدّلوا الخطة",1,"ترتيب الأولويات والتواصل مع الفريق بيحوّل الأزمة لخطة بديلة قابلة للتنفيذ."],
["تتصرف لوحدك من غير ما تقول لحد",0,"الفريق لازم يعرف عشان يشارك في الحل، والعبء لوحدك بيرفع احتمال الخطأ."]]}
];
const L=[[5,"صانع حياة متمكّن","قراراتك كانت صح من أول مرة تقريبًا. كمّل وشارك خبرتك مع زملائك."],
[3,"صانع حياة في الطريق","أغلب قراراتك سليمة، وراجع المواقف اللي صحّحتها لأنها أكتر حاجة هتفيدك."],
[0,"صانع حياة بيبدأ رحلته","الأخطاء هي أسرع طريق للتعلّم. العب تاني وشوف الفرق."]];
const app=document.getElementById('app');
let i=0,score=0,wrong=0,mistakes=0;
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function start(){i=score=mistakes=0;app.innerHTML=`<h1>ألعاب ملف التنمية</h1><div class="rule"></div><p class="sub">لعبة رقمية بالذكاء الاصطناعي لصناع الحياة: تتعلّم، تجرّب، تطبّق، وتصحّح أخطاءك.</p><p class="sub">خمس مواقف تطوعية، اختار التصرف الأنسب. لو اخترت غلط، هتعرف السبب وتجرّب تاني.</p><button class="btn" id="go">ابدأ اللعبة</button>`;document.getElementById('go').onclick=()=>show(0)}
function path(n){let h='';for(let k=0;k<5;k++){h+=`<div class="dot ${k<n?'done':k==n?'now':''}">${ar(k+1)}</div>`;if(k<4)h+='<div class="line"></div>'}return`<div class="path" aria-label="موقف ${ar(n+1)} من ٥">${h}</div>`}
function show(n){i=n;wrong=0;const q=Q[n];app.innerHTML=path(n)+`<div class="card"><h2>${q.s}</h2></div><div class="opts" id="opts"></div><div id="fb"></div>`;
q.o.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=o[0];b.onclick=()=>pick(k,b);document.getElementById('opts').appendChild(b)})}
function pick(k,b){const o=Q[i].o[k],fb=document.getElementById('fb');
if(o[1]){if(!wrong)score++;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');
fb.innerHTML=`<div class="fb"><b>تصرف سليم</b>${o[2]}</div><button class="btn" id="nx" style="margin-top:14px;width:100%">${i<4?'الموقف التالي':'شوف نتيجتك'}</button>`;
document.getElementById('nx').onclick=()=>i<4?show(i+1):end();document.getElementById('nx').focus()}
else{if(!wrong)mistakes++;wrong++;b.classList.add('no');b.disabled=true;fb.innerHTML=`<div class="fb no"><b>مش الأنسب.. جرّب اختيار تاني</b>${o[2]}</div>`}}
function end(){const l=L.find(x=>score>=x[0]);app.innerHTML=`<p class="sub">نتيجتك</p><div class="big">${ar(score)} / ٥</div><h2>${l[1]}</h2><p class="sub">${l[2]}</p><p class="sub">صحّحت ${ar(mistakes)} ${mistakes==1?'موقف':'مواقف'} بعد التجربة، وده جزء من التعلّم.</p><button class="btn" id="re">العب تاني</button>`;document.getElementById('re').onclick=start}
start();
</script>
</body>
